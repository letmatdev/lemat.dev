pre-commit:
  jobs:
    - run: npx ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.md"
        - "*.mdx"
      stage_fixed: true
